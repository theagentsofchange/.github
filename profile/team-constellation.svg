<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agents of Change — core team constellation</title>
  <desc id="desc">Six core team members — Iris (Product Owner), Magnus (Scrum Master), Nova (Backend Developer), Lux (Frontend Developer), Talia (Requirements Engineer, Functional) and Ruben (Requirements Engineer, NFR &amp; Compliance) — orbiting the Agents of Change mission.</desc>

  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0%" stop-color="#141d3d"/>
      <stop offset="55%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#060914"/>
    </radialGradient>
    <radialGradient id="hubFill" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0%" stop-color="#1e2c5c"/>
      <stop offset="80%" stop-color="#101a36"/>
      <stop offset="100%" stop-color="#0c142c"/>
    </radialGradient>
    <linearGradient id="hubRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <pattern id="dots" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="18" r="1" fill="#94a3b8" opacity="0.22"/>
      <circle cx="48" cy="8" r="0.8" fill="#94a3b8" opacity="0.18"/>
      <circle cx="62" cy="44" r="1.1" fill="#94a3b8" opacity="0.16"/>
      <circle cx="24" cy="58" r="0.7" fill="#94a3b8" opacity="0.2"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name  { font-family: "Segoe UI","DejaVu Sans",Helvetica,Arial,sans-serif; font-size: 21px; font-weight: 700; fill: #F8FAFC; }
      .role  { font-family: "Segoe UI","DejaVu Sans",Helvetica,Arial,sans-serif; font-size: 13.5px; font-weight: 400; fill: #A5B4FC; }
      .role2 { font-family: "Segoe UI","DejaVu Sans",Helvetica,Arial,sans-serif; font-size: 12px; font-weight: 400; fill: #94A3B8; }
      .emoji { font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif; font-size: 34px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- faint outer rings -->
  <circle cx="800" cy="450" r="380" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="1.2" stroke-dasharray="2 14"/>
  <circle cx="800" cy="450" r="300" fill="none" stroke="rgba(148,163,184,0.10)" stroke-width="1.2" stroke-dasharray="1 10"/>

  <!-- network edges: hub spokes + hexagon ring (collaboration, not hierarchy) -->
  <g fill="none" stroke-linecap="round">
    <line x1="800" y1="450" x2="800" y2="130" stroke="rgba(167,139,250,0.30)" stroke-width="1.6"/>
    <line x1="800" y1="450" x2="1077" y2="290" stroke="rgba(34,211,238,0.28)" stroke-width="1.6"/>
    <line x1="800" y1="450" x2="1077" y2="610" stroke="rgba(52,211,153,0.28)" stroke-width="1.6"/>
    <line x1="800" y1="450" x2="800" y2="770" stroke="rgba(232,121,249,0.28)" stroke-width="1.6"/>
    <line x1="800" y1="450" x2="523" y2="610" stroke="rgba(251,191,36,0.28)" stroke-width="1.6"/>
    <line x1="800" y1="450" x2="523" y2="290" stroke="rgba(167,139,250,0.28)" stroke-width="1.6"/>
    <line x1="800" y1="130" x2="1077" y2="290" stroke="rgba(148,163,184,0.16)" stroke-width="1.2" stroke-dasharray="5 7"/>
    <line x1="1077" y1="290" x2="1077" y2="610" stroke="rgba(148,163,184,0.16)" stroke-width="1.2" stroke-dasharray="5 7"/>
    <line x1="1077" y1="610" x2="800" y2="770" stroke="rgba(148,163,184,0.16)" stroke-width="1.2" stroke-dasharray="5 7"/>
    <line x1="800" y1="770" x2="523" y2="610" stroke="rgba(148,163,184,0.16)" stroke-width="1.2" stroke-dasharray="5 7"/>
    <line x1="523" y1="610" x2="523" y2="290" stroke="rgba(148,163,184,0.16)" stroke-width="1.2" stroke-dasharray="5 7"/>
    <line x1="523" y1="290" x2="800" y2="130" stroke="rgba(148,163,184,0.16)" stroke-width="1.2" stroke-dasharray="5 7"/>
  </g>

  <!-- ================= HUB ================= -->
  <g>
    <circle cx="800" cy="450" r="152" fill="none" stroke="url(#hubRing)" stroke-width="2" opacity="0.35"/>
    <circle cx="800" cy="450" r="134" fill="url(#hubFill)" stroke="url(#hubRing)" stroke-width="3" filter="url(#glow)"/>
    <text x="800" y="418" font-family="'Segoe UI','DejaVu Sans',sans-serif" font-size="14" font-weight="700" fill="#a5b4fc" letter-spacing="6" text-anchor="middle">ONE TEAM</text>
    <text x="800" y="452" font-family="'Segoe UI','DejaVu Sans',sans-serif" font-size="25" font-weight="700" fill="#f8fafc" letter-spacing="3" text-anchor="middle">AGENTS OF</text>
    <text x="800" y="484" font-family="'Segoe UI','DejaVu Sans',sans-serif" font-size="25" font-weight="700" fill="#f8fafc" letter-spacing="4" text-anchor="middle">CHANGE</text>
    <text x="800" y="522" font-family="'Segoe UI','DejaVu Sans',sans-serif" font-size="13.5" fill="#94a3b8" text-anchor="middle">changing the way development works</text>
  </g>

  <!-- ================= MEMBERS ================= -->

  <!-- Iris — Product Owner (top) -->
  <g>
    <rect x="680" y="50" width="240" height="160" rx="18" fill="rgba(52,168,83,0.08)" stroke="rgba(52,168,83,0.55)" stroke-width="1.6"/>
    <circle cx="800" cy="98" r="32" fill="rgba(52,168,83,0.16)" stroke="rgba(52,168,83,0.45)"/>
    <text class="emoji" x="800" y="98" text-anchor="middle" dominant-baseline="central">🌿</text>
    <text class="name" x="800" y="150" text-anchor="middle">Iris</text>
    <text class="role" x="800" y="174" text-anchor="middle">Product Owner</text>
  </g>

  <!-- Magnus — Scrum Master (top-left) -->
  <g>
    <rect x="403" y="210" width="240" height="160" rx="18" fill="rgba(14,165,233,0.08)" stroke="rgba(14,165,233,0.55)" stroke-width="1.6"/>
    <circle cx="523" cy="258" r="32" fill="rgba(14,165,233,0.16)" stroke="rgba(14,165,233,0.45)"/>
    <text class="emoji" x="523" y="258" text-anchor="middle" dominant-baseline="central">🧭</text>
    <text class="name" x="523" y="310" text-anchor="middle">Magnus</text>
    <text class="role" x="523" y="334" text-anchor="middle">Scrum Master</text>
  </g>

  <!-- Nova — Backend Developer (top-right) -->
  <g>
    <rect x="957" y="210" width="240" height="160" rx="18" fill="rgba(100,116,139,0.14)" stroke="rgba(148,163,184,0.55)" stroke-width="1.6"/>
    <circle cx="1077" cy="258" r="32" fill="rgba(100,116,139,0.22)" stroke="rgba(148,163,184,0.5)"/>
    <text class="emoji" x="1077" y="258" text-anchor="middle" dominant-baseline="central">⚙️</text>
    <text class="name" x="1077" y="310" text-anchor="middle">Nova</text>
    <text class="role" x="1077" y="334" text-anchor="middle">Backend Developer</text>
  </g>

  <!-- Ruben — Requirements Engineer NFR (bottom-right) -->
  <g>
    <rect x="957" y="530" width="240" height="160" rx="18" fill="rgba(99,102,241,0.09)" stroke="rgba(99,102,241,0.55)" stroke-width="1.6"/>
    <circle cx="1077" cy="578" r="32" fill="rgba(99,102,241,0.16)" stroke="rgba(99,102,241,0.45)"/>
    <text class="emoji" x="1077" y="578" text-anchor="middle" dominant-baseline="central">⚖️</text>
    <text class="name" x="1077" y="630" text-anchor="middle">Ruben</text>
    <text class="role" x="1077" y="654" text-anchor="middle">Requirements Engineer</text>
    <text class="role2" x="1077" y="672" text-anchor="middle">NFR &amp; Compliance</text>
  </g>

  <!-- Talia — Requirements Engineer Functional (bottom) -->
  <g>
    <rect x="680" y="690" width="240" height="160" rx="18" fill="rgba(245,158,11,0.09)" stroke="rgba(245,158,11,0.55)" stroke-width="1.6"/>
    <circle cx="800" cy="738" r="32" fill="rgba(245,158,11,0.16)" stroke="rgba(245,158,11,0.45)"/>
    <text class="emoji" x="800" y="738" text-anchor="middle" dominant-baseline="central">📝</text>
    <text class="name" x="800" y="790" text-anchor="middle">Talia</text>
    <text class="role" x="800" y="814" text-anchor="middle">Requirements Engineer</text>
    <text class="role2" x="800" y="832" text-anchor="middle">Functional</text>
  </g>

  <!-- Lux — Frontend Developer (bottom-left) -->
  <g>
    <rect x="403" y="530" width="240" height="160" rx="18" fill="rgba(139,92,246,0.10)" stroke="rgba(139,92,246,0.6)" stroke-width="1.6"/>
    <circle cx="523" cy="578" r="32" fill="rgba(139,92,246,0.18)" stroke="rgba(139,92,246,0.5)"/>
    <text class="emoji" x="523" y="578" text-anchor="middle" dominant-baseline="central">🎨</text>
    <text class="name" x="523" y="630" text-anchor="middle">Lux</text>
    <text class="role" x="523" y="654" text-anchor="middle">Frontend Developer</text>
  </g>
</svg>
