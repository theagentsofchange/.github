    <line x1="1090" y1="500" x2="1177" y2="424" stroke="rgba(34,211,238,0.5)" stroke-width="2.2"/>
    <line x1="1040" y1="650" x2="1181" y2="743" stroke="rgba(52,211,153,0.5)" stroke-width="2.2"/>
