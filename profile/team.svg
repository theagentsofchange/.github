<svg xmlns="http://www.w3.org/2000/svg" width="870" height="370" viewBox="0 0 870 370" role="img" aria-labelledby="title desc">
  <title id="title">Agents of Change — core Scrum team</title>
  <desc id="desc">Six core team members: Iris (Product Owner), Magnus (Scrum Master), Nova (Backend Developer), Lux (Frontend Developer), Talia (Requirements Engineer, Functional) and Ruben (Requirements Engineer, NFR &amp; Compliance).</desc>

  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1F2937" flood-opacity="0.10"/>
    </filter>
    <style>
      .card  { fill: #FFFFFF; stroke: #E5E7EB; stroke-width: 1; }
      .name  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #1F2937; }
      .role  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #6B7280; }
      .role2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #9CA3AF; }
      .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", sans-serif; font-size: 30px; }
    </style>
  </defs>

  <!-- Row 1 -->
  <!-- Iris — Product Owner -->
  <g>
    <rect class="card" x="25" y="25" width="260" height="150" rx="14" filter="url(#shadow)"/>
    <circle cx="155" cy="71" r="28" fill="#34A853" fill-opacity="0.12" stroke="#34A853" stroke-opacity="0.35"/>
    <text class="emoji" x="155" y="71" text-anchor="middle" dominant-baseline="central">🌿</text>
    <text class="name" x="155" y="119" text-anchor="middle">Iris</text>
    <text class="role" x="155" y="141" text-anchor="middle">Product Owner</text>
  </g>

  <!-- Magnus — Scrum Master -->
  <g>
    <rect class="card" x="305" y="25" width="260" height="150" rx="14" filter="url(#shadow)"/>
    <circle cx="435" cy="71" r="28" fill="#0EA5E9" fill-opacity="0.12" stroke="#0EA5E9" stroke-opacity="0.35"/>
    <text class="emoji" x="435" y="71" text-anchor="middle" dominant-baseline="central">🧭</text>
    <text class="name" x="435" y="119" text-anchor="middle">Magnus</text>
    <text class="role" x="435" y="141" text-anchor="middle">Scrum Master</text>
  </g>

  <!-- Nova — Backend Developer -->
  <g>
    <rect class="card" x="585" y="25" width="260" height="150" rx="14" filter="url(#shadow)"/>
    <circle cx="715" cy="71" r="28" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-opacity="0.35"/>
    <text class="emoji" x="715" y="71" text-anchor="middle" dominant-baseline="central">⚙️</text>
    <text class="name" x="715" y="119" text-anchor="middle">Nova</text>
    <text class="role" x="715" y="141" text-anchor="middle">Backend Developer</text>
  </g>

  <!-- Row 2 -->
  <!-- Lux — Frontend Developer -->
  <g>
    <rect class="card" x="25" y="195" width="260" height="150" rx="14" filter="url(#shadow)"/>
    <circle cx="155" cy="241" r="28" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.35"/>
    <text class="emoji" x="155" y="241" text-anchor="middle" dominant-baseline="central">🎨</text>
    <text class="name" x="155" y="289" text-anchor="middle">Lux</text>
    <text class="role" x="155" y="311" text-anchor="middle">Frontend Developer</text>
  </g>

  <!-- Talia — Requirements Engineer (functional) -->
  <g>
    <rect class="card" x="305" y="195" width="260" height="150" rx="14" filter="url(#shadow)"/>
    <circle cx="435" cy="241" r="28" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.35"/>
    <text class="emoji" x="435" y="241" text-anchor="middle" dominant-baseline="central">📝</text>
    <text class="name" x="435" y="289" text-anchor="middle">Talia</text>
    <text class="role" x="435" y="311" text-anchor="middle">Requirements Engineer</text>
    <text class="role2" x="435" y="327" text-anchor="middle">Functional</text>
  </g>

  <!-- Ruben — Requirements Engineer (NFR & compliance) -->
  <g>
    <rect class="card" x="585" y="195" width="260" height="150" rx="14" filter="url(#shadow)"/>
    <circle cx="715" cy="241" r="28" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.35"/>
    <text class="emoji" x="715" y="241" text-anchor="middle" dominant-baseline="central">⚖️</text>
    <text class="name" x="715" y="289" text-anchor="middle">Ruben</text>
    <text class="role" x="715" y="311" text-anchor="middle">Requirements Engineer</text>
    <text class="role2" x="715" y="327" text-anchor="middle">NFR &amp; Compliance</text>
  </g>
</svg>
